name: Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'terraform/**'
      - '.gitignore'
      - '.readthedocs.yaml'
  schedule:
    - cron: '53 0 * * *'  # Daily at 00:53 UTC
  workflow_dispatch:
    inputs:
      kafka-revision:
        description: Test this Charmhub revision of `kafka` instead of building the charm
        type: string
        default: ''
      kafka-k8s-revision:
        description: Test this Charmhub revision of `kafka-k8s` instead of building the charm
        type: string
        default: ''
      kafka-connect-revision:
        description: Test this Charmhub revision of `kafka-connect` instead of building the charm
        type: string
        default: ''
      kafka-connect-k8s-revision:
        description: Test this Charmhub revision of `kafka-connect-k8s` instead of building the charm
        type: string
        default: ''
  # Triggered on push to branch "main" by .github/workflows/release.yaml
  workflow_call:
    inputs:
      kafka-revision:
        description: Test this Charmhub revision of `kafka` instead of building the charm
        type: string
        default: ''
      kafka-k8s-revision:
        description: Test this Charmhub revision of `kafka-k8s` instead of building the charm
        type: string
        default: ''
      kafka-connect-revision:
        description: Test this Charmhub revision of `kafka-connect` instead of building the charm
        type: string
        default: ''
      kafka-connect-k8s-revision:
        description: Test this Charmhub revision of `kafka-connect-k8s` instead of building the charm
        type: string
        default: ''
    outputs:
      artifact-prefix:
        description: build_charm.yaml `artifact-prefix` output
        value: ${{ jobs.build-release.outputs.artifact-prefix || jobs.build-dev.outputs.artifact-prefix }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install tox
        run: pipx install tox
      - name: Run linters
        run: tox run -e lint

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install tox
        run: pipx install tox
      - name: Run tests
        run: tox run -e unit

  build-matrix:
    name: Collect charms to build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      paths: ${{ steps.collect.outputs.paths }}
    steps:
      # A charm pinned to a Charmhub revision is deployed from the store, so there
      # is nothing to build for it.
      - name: Drop charms pinned to a Charmhub revision
        id: collect
        env:
          KAFKA_REVISION: ${{ inputs.kafka-revision }}
          KAFKA_K8S_REVISION: ${{ inputs.kafka-k8s-revision }}
          KAFKA_CONNECT_REVISION: ${{ inputs.kafka-connect-revision }}
          KAFKA_CONNECT_K8S_REVISION: ${{ inputs.kafka-connect-k8s-revision }}
        run: |
          paths=()
          if [ -z "$KAFKA_REVISION" ]; then paths+=("machine"); fi
          if [ -z "$KAFKA_K8S_REVISION" ]; then paths+=("k8s"); fi
          if [ -z "$KAFKA_CONNECT_REVISION" ]; then paths+=("connect_machine"); fi
          if [ -z "$KAFKA_CONNECT_K8S_REVISION" ]; then paths+=("connect_k8s"); fi
          # test charms are never published, so they are always built from the branch
          paths+=(
            "tests/integration/machine/app-charm"
            "tests/integration/k8s/app-charm"
            "tests/integration/connect_machine/sink-integrator-charm"
            "tests/integration/connect_machine/source-integrator-charm"
            "tests/integration/connect_k8s/app-charm"
          )
          json="$(printf '%s\n' "${paths[@]}" | jq -Rsc 'split("\n")[:-1]')"
          echo "Charms to build: $json"
          echo "paths=$json" >> "$GITHUB_OUTPUT"

  # FIXME: remove this once charmcraft monorepo feature is released.
  build-dev:
    if: ${{ github.ref_name != 'main' }}
    needs:
      - build-matrix
    strategy:
      matrix:
        path: ${{ fromJSON(needs.build-matrix.outputs.paths) }}
    name: Build charm for testing | ${{ matrix.path }}
    uses: ./.github/workflows/_build_charm_dev.yaml
    with:
      path-to-charm-directory: ${{ matrix.path }}
    permissions:
      actions: read
      contents: read

  build-release:
    if: ${{ github.ref_name == 'main' }}
    needs:
      - build-matrix
    strategy:
      matrix:
        path: ${{ fromJSON(needs.build-matrix.outputs.paths) }}
    name: Build charm for release | ${{ matrix.path }}
    # FIXME: update once monorepo feature reaches DPW
    # uses: canonical/data-platform-workflows/.github/workflows/build_charm.yaml@v32.2.2
    uses: ./.github/workflows/_build_charm_dev.yaml
    with:
      path-to-charm-directory: ${{ matrix.path }}
      # FIXME: _build_charm_dev.yaml doesn't accept `cache`; restore alongside build_charm.yaml above
      # cache: false  # TODO: remove after re-added to ccc-hub
    permissions:
      actions: read
      contents: read

  integration-kafka-machine-single:
    name: Kafka | machine | single
    needs: [lint, unit-test, build-dev, build-release]
    if: |
      !cancelled() &&
      needs.lint.result == 'success' &&
      needs.unit-test.result == 'success' &&
      (needs.build-dev.result == 'success' || needs.build-release.result == 'success')
    uses: ./.github/workflows/_integration_test.yaml
    permissions:
      contents: read
    with:
      substrate: lxd
      tox-env-prefix: integration-machine
      runner-size: large
      extra-tox-args: --kraft-mode single
      charm-revision: ${{ inputs.kafka-revision }}
      tox-environments: >-
        [
          "auto-balance", "charm", "provider", "provider-v1",
          "password-rotation", "tls", "refresh", "tls-complex",
          "kraft", "kraft-tls", "ha", "spaces", "terraform"
        ]
      artifact-prefix: ${{ needs.build-dev.outputs.artifact-prefix || needs.build-release.outputs.artifact-prefix }}
      packed-charms: ${{ needs.build-dev.outputs.charms || needs.build-release.outputs.charms }}

  integration-kafka-machine-multi:
    name: Kafka | machine | multi
    needs: [lint, unit-test, build-dev, build-release]
    if: |
      !cancelled() &&
      needs.lint.result == 'success' &&
      needs.unit-test.result == 'success' &&
      (needs.build-dev.result == 'success' || needs.build-release.result == 'success')
    uses: ./.github/workflows/_integration_test.yaml
    permissions:
      contents: read
    with:
      substrate: lxd
      tox-env-prefix: integration-machine
      runner-size: xlarge
      extra-tox-args: --kraft-mode multi
      charm-revision: ${{ inputs.kafka-revision }}
      tox-environments: >-
        [
          "auto-balance", "charm", "provider", "provider-v1",
          "password-rotation", "tls", "refresh", "tls-complex",
          "balancer-broker", "balancer-controller", "kraft", "kraft-tls",
          "ha", "ha-controller", "spaces", "oauth"
        ]
      artifact-prefix: ${{ needs.build-dev.outputs.artifact-prefix || needs.build-release.outputs.artifact-prefix }}
      packed-charms: ${{ needs.build-dev.outputs.charms || needs.build-release.outputs.charms }}

  integration-kafka-k8s-single:
    name: Kafka | k8s | single
    needs: [lint, unit-test, build-dev, build-release]
    if: |
      !cancelled() &&
      needs.lint.result == 'success' &&
      needs.unit-test.result == 'success' &&
      (needs.build-dev.result == 'success' || needs.build-release.result == 'success')
    uses: ./.github/workflows/_integration_test.yaml
    permissions:
      contents: read
    with:
      substrate: k8s
      tox-env-prefix: integration-k8s
      runner-size: large
      extra-tox-args: --kraft-mode single
      charm-revision: ${{ inputs.kafka-k8s-revision }}
      tox-environments: >-
        [
          "auto-balance", "charm", "provider", "provider-v1",
          "password-rotation", "tls", "tls-complex", "kraft",
          "kraft-tls", "ha", "refresh"
        ]
      artifact-prefix: ${{ needs.build-dev.outputs.artifact-prefix || needs.build-release.outputs.artifact-prefix }}
      packed-charms: ${{ needs.build-dev.outputs.charms || needs.build-release.outputs.charms }}

  integration-kafka-k8s-multi:
    name: Kafka | k8s | multi
    needs: [lint, unit-test, build-dev, build-release]
    if: |
      !cancelled() &&
      needs.lint.result == 'success' &&
      needs.unit-test.result == 'success' &&
      (needs.build-dev.result == 'success' || needs.build-release.result == 'success')
    uses: ./.github/workflows/_integration_test.yaml
    permissions:
      contents: read
    with:
      substrate: k8s
      tox-env-prefix: integration-k8s
      runner-size: xlarge
      extra-tox-args: --kraft-mode multi
      charm-revision: ${{ inputs.kafka-k8s-revision }}
      tox-environments: >-
        [
          "auto-balance", "charm", "provider", "provider-v1",
          "password-rotation", "tls", "tls-complex", "balancer-broker",
          "balancer-controller", "kraft", "kraft-tls", "ha",
          "ha-controller", "refresh"
        ]
      artifact-prefix: ${{ needs.build-dev.outputs.artifact-prefix || needs.build-release.outputs.artifact-prefix }}
      packed-charms: ${{ needs.build-dev.outputs.charms || needs.build-release.outputs.charms }}

  # Split per Kafka version so `--kafka N` is a literal `extra-tox-args` value.
  # The terraform tests don't involve Kafka, so they only run against Kafka 4.
  integration-connect-machine-kafka3:
    name: Connect | machine | Kafka 3
    needs: [lint, unit-test, build-dev, build-release]
    if: |
      !cancelled() &&
      needs.lint.result == 'success' &&
      needs.unit-test.result == 'success' &&
      (needs.build-dev.result == 'success' || needs.build-release.result == 'success')
    uses: ./.github/workflows/_integration_test.yaml
    permissions:
      contents: read
    with:
      substrate: lxd
      tox-env-prefix: integration-connect-machine
      runner-size: large
      timeout-minutes: 90
      extra-tox-args: --kafka 3
      charm-revision: ${{ inputs.kafka-connect-revision }}
      tox-environments: >-
        [
          "charm", "tls", "plugins", "provider",
          "upgrade", "requirer", "scaling", "secrets"
        ]
      artifact-prefix: ${{ needs.build-dev.outputs.artifact-prefix || needs.build-release.outputs.artifact-prefix }}
      packed-charms: ${{ needs.build-dev.outputs.charms || needs.build-release.outputs.charms }}

  integration-connect-machine-kafka4:
    name: Connect | machine | Kafka 4
    needs: [lint, unit-test, build-dev, build-release]
    if: |
      !cancelled() &&
      needs.lint.result == 'success' &&
      needs.unit-test.result == 'success' &&
      (needs.build-dev.result == 'success' || needs.build-release.result == 'success')
    uses: ./.github/workflows/_integration_test.yaml
    permissions:
      contents: read
    with:
      substrate: lxd
      tox-env-prefix: integration-connect-machine
      runner-size: large
      timeout-minutes: 90
      extra-tox-args: --kafka 4
      charm-revision: ${{ inputs.kafka-connect-revision }}
      tox-environments: >-
        [
          "charm", "tls", "plugins", "provider", "upgrade",
          "requirer", "scaling", "secrets", "terraform"
        ]
      artifact-prefix: ${{ needs.build-dev.outputs.artifact-prefix || needs.build-release.outputs.artifact-prefix }}
      packed-charms: ${{ needs.build-dev.outputs.charms || needs.build-release.outputs.charms }}

  integration-connect-k8s:
    name: Connect | k8s
    needs: [lint, unit-test, build-dev, build-release]
    if: |
      !cancelled() &&
      needs.lint.result == 'success' &&
      needs.unit-test.result == 'success' &&
      (needs.build-dev.result == 'success' || needs.build-release.result == 'success')
    uses: ./.github/workflows/_integration_test.yaml
    permissions:
      contents: read
    with:
      substrate: k8s
      tox-env-prefix: integration-connect-k8s
      runner-size: medium
      timeout-minutes: 90
      charm-revision: ${{ inputs.kafka-connect-k8s-revision }}
      tox-environments: >-
        [
          "charm", "tls", "plugins", "provider",
          "scaling", "secrets", "upgrade"
        ]
      artifact-prefix: ${{ needs.build-dev.outputs.artifact-prefix || needs.build-release.outputs.artifact-prefix }}
      packed-charms: ${{ needs.build-dev.outputs.charms || needs.build-release.outputs.charms }}
