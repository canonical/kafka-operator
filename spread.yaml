project: charmed-kafka-docs-tutorial

# The project root is mirrored to this path inside the test VM.
path: /charmed-kafka

backends:
  multipass:
    type: adhoc
    allocate: |
      instance_name="kafka-tutorial-vm"
      multipass delete --purge "$instance_name" 2>/dev/null || true

      # 8 CPUs / 16 GB RAM / 50 GB disk – sized for a 6-unit Juju/LXD cluster.
      multipass launch --cpus "${SPREAD_VM_CPUS:-8}" --disk "${SPREAD_VM_DISK:-50G}" \
        --memory "${SPREAD_VM_MEM:-16G}" --name "$instance_name" 24.04

      # Pre-install snaps and enable root SSH for Spread.
      multipass exec "$instance_name" -- sudo sh -c "
        set -e
        snap install lxd --channel=5.21/stable
        snap install juju --channel=3/stable
        echo root:${SPREAD_PASSWORD} | chpasswd
        printf 'PasswordAuthentication yes\nPermitRootLogin yes\n' \
          > /etc/ssh/sshd_config.d/10-spread.conf
        systemctl restart ssh
      "

      ip=$(multipass info "$instance_name" | awk '/^IPv4:/ {print $2}')
      ADDRESS "$ip"

    discard: |
      instance_name="kafka-tutorial-vm"
      multipass exec "$instance_name" -- sudo cat /var/tmp/tutorial-memory/report.txt 2>/dev/null || true
      multipass delete --purge "$instance_name"

    systems:
      - ubuntu-24.04-64:
          workers: 1

suites:
  tests/tutorial/:
    summary: Charmed Apache Kafka tutorial
    systems:
      - ubuntu-24.04-64
    prepare: |
      # Spread SSHs in as root but does not always set HOME=/root.
      export HOME=/root
      mkdir -p /root/.local/share/juju
      bash "$SPREAD_PATH/tests/tutorial/memory-monitor.sh" start
    prepare-each: |
      bash "$SPREAD_PATH/tests/tutorial/memory-monitor.sh" mark "$SPREAD_TASK"
    restore: |
      bash "$SPREAD_PATH/tests/tutorial/memory-monitor.sh" stop
      bash "$SPREAD_PATH/tests/tutorial/memory-monitor.sh" report
    debug-each: |
      export HOME=/root
      bash "$SPREAD_PATH/tests/tutorial/memory-monitor.sh" report || true
      free -m
      df -h /
      dmesg | grep -i -E "out of memory|oom-kill" | tail -n 20 || true
      juju status --relations || true
